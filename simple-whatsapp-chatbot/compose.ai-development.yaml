# Additive local-only infrastructure for Integrasi Chatbot AI.
# Run together with compose.yaml; production credentials and storage remain
# an explicit deployment decision.
services:
  app:
    environment:
      REDIS_URL: redis://redis:6379
      OBJECT_STORAGE_ENDPOINT: http://object-storage:9000
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-raho-ai-knowledge}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-minioadmin}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-minioadmin}
      AI_CHATBOT_PROVIDER_BASE_URL: ${AI_CHATBOT_PROVIDER_BASE_URL:-https://api.openai.com/v1}
      AI_CHATBOT_PROVIDER_SECRET_REF: ${AI_CHATBOT_PROVIDER_SECRET_REF:-}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
      AI_CHATBOT_ALPHA_RUNTIME_ENABLED: ${AI_CHATBOT_ALPHA_RUNTIME_ENABLED:-false}
    depends_on:
      redis:
        condition: service_healthy
      vector-init:
        condition: service_completed_successfully
      object-storage-init:
        condition: service_completed_successfully

  db:
    # Match compose.yaml's current postgres:16 Debian 13 base so an existing
    # volume keeps the same libc collation version when pgvector is added.
    image: pgvector/pgvector:0.8.2-pg16-trixie
    volumes:
      - ./docker/ai-chatbot/init-pgvector.sql:/docker-entrypoint-initdb.d/20-ai-chatbot-pgvector.sql:ro

  vector-init:
    image: pgvector/pgvector:0.8.2-pg16-trixie
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        psql -v ON_ERROR_STOP=1 -h "$${POSTGRES_HOST}" -U "$${POSTGRES_USER}"
        -d "$${POSTGRES_DB}" -c "CREATE EXTENSION IF NOT EXISTS vector;"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  object-storage:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - object_storage_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  object-storage-init:
    image: minio/mc:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-raho-ai-knowledge}
    depends_on:
      object-storage:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://object-storage:9000 "$${MINIO_ROOT_USER}"
        "$${MINIO_ROOT_PASSWORD}" && mc mb --ignore-existing
        "local/$${OBJECT_STORAGE_BUCKET}"

volumes:
  redis_data:
  object_storage_data:
