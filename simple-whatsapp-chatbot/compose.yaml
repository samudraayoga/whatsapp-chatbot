services:
  app:
    build:
      context: ..
      dockerfile: simple-whatsapp-chatbot/Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - whatsapp_auth:/app/auth
    restart: unless-stopped

  db:
    # AI retrieval depends on pgvector. Keep the base development database on
    # the pgvector image so `npm run dev` cannot replace it with plain Postgres.
    image: pgvector/pgvector:0.8.2-pg16-trixie
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  whatsapp_auth:
