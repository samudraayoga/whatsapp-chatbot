      tags: [AI Documents]
      operationId: listKnowledgeDocuments
      summary: List tenant-scoped document processing records
      x-implementation-status: implemented
      x-target-sprint: 3
      x-permission: knowledge.read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: query
          in: query
