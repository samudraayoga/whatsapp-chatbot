        data: { $ref: "#/components/schemas/Feedback" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    UnansweredQuestion:
      type: object
      additionalProperties: false
      required:
        - id
        - sampleQuestion
        - normalizedQuestion
        - occurrenceCount
        - bestSimilarity
        - nearestKnowledgeIds
        - predictedCategoryId
        - predictedCategoryName
        - status
        - reviewedBy
        - resolvedKnowledgeItemId
        - reviewNote
        - conversationIds
        - firstSeenAt
        - lastSeenAt
      properties:
        id:
          type: string
          format: uuid
        sampleQuestion:
          type: string
        normalizedQuestion: { type: string }
        occurrenceCount:
          type: integer
          minimum: 1
        bestSimilarity:
          type: [number, "null"]
        nearestKnowledgeIds: { type: array, items: { type: string } }
        predictedCategoryId:
          type: [string, "null"]
          format: uuid
        predictedCategoryName: { type: [string, "null"] }
        status:
          type: string
          enum: [new, reviewing, knowledge_created, resolved, ignored]
        reviewedBy:
          type: [string, "null"]
          format: uuid
        resolvedKnowledgeItemId:
          type: [string, "null"]
          format: uuid
        reviewNote: { type: [string, "null"] }
        conversationIds: { type: array, items: { type: string, format: uuid } }
        firstSeenAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time

    UnansweredUpdateRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [new, reviewing, knowledge_created, resolved, ignored]
        predictedCategoryId:
          type: [string, "null"]
          format: uuid
        resolvedKnowledgeItemId:
          type: [string, "null"]
          format: uuid
        reviewNote: { type: [string, "null"], maxLength: 2000 }

    UnansweredResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/UnansweredQuestion"
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    UnansweredListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/UnansweredQuestion"
        meta: { $ref: "#/components/schemas/CursorResponseMeta" }

    CreateKnowledgeFromUnansweredRequest:
      type: object
      additionalProperties: false
      required: [answer]
      properties:
        title: { type: string, maxLength: 255 }
        answer: { type: string, minLength: 1, maxLength: 20000 }
        categoryId: { type: [string, "null"], format: uuid }
        requiresDisclaimer: { type: boolean, default: false }

    UnansweredKnowledgeResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [unanswered, knowledge]
          properties:
            unanswered: { $ref: "#/components/schemas/UnansweredQuestion" }
            knowledge: { $ref: "#/components/schemas/KnowledgeItem" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    TestCaseWriteRequest:
      type: object
      additionalProperties: false
      required: [name, question]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        question: { type: string, minLength: 1, maxLength: 4096 }
        recentContext: { type: array, maxItems: 10, items: { type: string, maxLength: 1000 } }
        promptVersionId: { type: [string, "null"], format: uuid }
        expectedCategory: { type: [string, "null"], maxLength: 50 }
        expectedKnowledgeIds: { type: array, maxItems: 20, items: { type: string } }
        mustContain: { type: array, maxItems: 20, items: { type: string } }
        mustNotContain: { type: array, maxItems: 20, items: { type: string } }
        expectedHandoff: { type: [boolean, "null"] }
        active: { type: boolean, default: true }

    TestRun:
      type: object
      additionalProperties: true
      required: [id, passed, score, checks, answerStatus, answerPreview, traceId, ranAt]
      properties:
        id: { type: string, format: uuid }
        testCaseId: { type: string, format: uuid }
        passed: { type: boolean }
        score: { type: number, minimum: 0, maximum: 1 }
        checks: { type: object, additionalProperties: { type: boolean } }
        answerStatus: { type: string }
        answerPreview: { type: string }
        traceId: { type: string }
        ranAt: { type: string, format: date-time }
        result: { $ref: "#/components/schemas/ChatResult" }

    TestCase:
      allOf:
        - $ref: "#/components/schemas/TestCaseWriteRequest"
        - type: object
          required: [id, active, createdBy, updatedBy, createdAt, updatedAt, runs]
          properties:
            id: { type: string, format: uuid }
            createdBy: { type: string, format: uuid }
            updatedBy: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            runs: { type: array, maxItems: 2, items: { $ref: "#/components/schemas/TestRun" } }

    TestCaseResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/TestCase" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    TestCaseListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/TestCase" } }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    TestRunResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/TestRun" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    TestBatchResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [total, passed, failed, passRate, runs]
          properties:
            total: { type: integer, minimum: 0 }
            passed: { type: integer, minimum: 0 }
            failed: { type: integer, minimum: 0 }
            passRate: { type: number, minimum: 0, maximum: 1 }
            runs: { type: array, items: { $ref: "#/components/schemas/TestRun" } }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    GenericDataResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: {}
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    AnalyticsResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          description: Tenant-scoped KPI, cost, warning, series, and ranking snapshot.
          additionalProperties: true
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    RuntimeRespondRequest:
      type: object
      additionalProperties: false
      required:
        - channel
        - channelSessionId
        - customerIdentifier
        - providerMessageId
        - message
        - timestamp
      properties:
        channel:
          type: string
          const: whatsapp
        channelSessionId:
          type: string
          maxLength: 150
        customerIdentifier:
          type: string
          minLength: 1
          maxLength: 255
        providerMessageId:
          type: string
          minLength: 1
          maxLength: 255
        message:
          type: string
          minLength: 1
          maxLength: 4096
        timestamp:
          type: string
          format: date-time

    RuntimeHandoffRequest:
      type: object
      additionalProperties: false
      required: [sourceMessageId, reason, priority]
      properties:
        sourceMessageId:
          type: integer
          minimum: 1
        conversationId:
          type: [string, "null"]
          format: uuid
        reason:
          type: string
          enum:
            - admin_requested
            - customer_interested
            - low_confidence
            - medical_personal
            - emergency
            - provider_failure
        priority:
          type: string
          enum: [normal, high, urgent]
        summary:
          type: [string, "null"]
          maxLength: 4000

    Handoff:
      type: object
      additionalProperties: false
      required:
        - id
        - contactId
        - sourceMessageId
        - state
        - assigneeUserId
        - dueAt
        - resolvedAt
        - resolutionNote
        - tenantId
        - aiConversationId
        - aiMessageTraceId
        - reason
        - priority
        - summary
        - knowledgeIds
        - safetyCategory
        - traceId
        - createdAt
        - updatedAt
        - contact
        - sourcePreview
      properties:
        id:
          type: string
          format: uuid
        contactId:
          type: string
        sourceMessageId:
          type: string
        state:
          type: string
          enum: [open, assigned, in_progress, resolved, closed, canceled]
        assigneeUserId:
          type: [string, "null"]
        dueAt:
          type: [string, "null"]
          format: date-time
        resolvedAt:
          type: [string, "null"]
          format: date-time
        resolutionNote:
          type: [string, "null"]
        tenantId:
          type: [string, "null"]
          format: uuid
        aiConversationId:
          type: [string, "null"]
          format: uuid
        aiMessageTraceId:
          type: [string, "null"]
          format: uuid
        reason:
          type: [string, "null"]
        priority:
          type: string
          enum: [normal, high]
        summary:
          type: [string, "null"]
        knowledgeIds:
          type: array
          items:
            type: string
        safetyCategory:
          type: [string, "null"]
        traceId:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        contact:
          type: object
          additionalProperties: false
          required: [displayName, maskedPhone]
          properties:
            displayName:
              type: [string, "null"]
            maskedPhone:
              type: [string, "null"]
        sourcePreview:
          type: string

    HandoffResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Handoff"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    HandoffListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Handoff"
        meta:
          type: object
          additionalProperties: false
          required: [requestId, generatedAt, nextCursor]
          properties:
            requestId:
              type: string
            generatedAt:
              type: string
              format: date-time
            nextCursor:
              type: [string, "null"]

    CursorPage:
      type: object
      additionalProperties: false
      required: [nextCursor, hasMore]
      properties:
        nextCursor:
          type: [string, "null"]
        hasMore:
          type: boolean
