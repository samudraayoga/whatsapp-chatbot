      responses:
        "201": { description: Immutable evaluation report, content: { application/json: { schema: { $ref: "#/components/schemas/GenericDataResponse" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/v1/ai-chatbot/release-readiness/gates/{gateKey}:
    put:
      tags: [AI Analytics]
      operationId: updateAiReleaseGate
      summary: Record an auditable release-gate decision and evidence
      x-implementation-status: implemented
      x-target-sprint: 8
      x-permission: ai.release.manage
      parameters:
        - name: gateKey
          in: path
          required: true
          schema:
            type: string
            enum: [knowledge, uat, medical, security, monitoring, rollback, admin_training, alert_owner, handoff_owner, product]
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, evidence, expectedRevision]
              properties:
                status: { type: string, enum: [pending, passed, failed] }
                evidence: { type: string, minLength: 1, maxLength: 2000 }
                expectedRevision: { type: integer, minimum: 1 }
      responses:
        "200": { description: Updated readiness snapshot, content: { application/json: { schema: { $ref: "#/components/schemas/GenericDataResponse" } } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/admin/v1/ai-chatbot/release-readiness/pilot:
    put:
      tags: [AI Analytics]
      operationId: updateAiPilotConfiguration
      summary: Request one gated rollout stage; effective customer traffic stays disabled
      x-implementation-status: implemented
      x-target-sprint: 8
      x-permission: ai.release.manage
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [percentage, channels, note, expectedRevision]
              properties:
                percentage: { type: integer, enum: [0, 5, 10, 25, 50, 100] }
                channels:
                  type: array
                  maxItems: 10
                  items: { type: string, enum: [internal, whatsapp] }
                note: { type: string, minLength: 1, maxLength: 2000 }
                expectedRevision: { type: integer, minimum: 1 }
      responses:
        "200": { description: Updated requested stage with effective percentage zero, content: { application/json: { schema: { $ref: "#/components/schemas/GenericDataResponse" } } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/admin/v1/ai-chatbot/release-readiness/emergency-pause:
    post:
      tags: [AI Analytics]
      operationId: emergencyPauseAiPilot
      summary: Set pilot to zero and deactivate the tenant integration
      x-implementation-status: implemented
      x-target-sprint: 8
      x-permission: ai.release.manage
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "200": { description: Paused readiness snapshot, content: { application/json: { schema: { $ref: "#/components/schemas/GenericDataResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/admin/v1/ai-chatbot/pilot/daily-review:
    get:
      tags: [AI Analytics]
      operationId: getAiPilotDailyReview
      summary: Aggregate one UTC day of pilot metrics, feedback, and unanswered questions
      x-implementation-status: implemented
      x-target-sprint: 8
      x-permission: ai.pilot.read
      parameters:
        - name: date
          in: query
          schema: { type: string, format: date }
      responses:
        "200": { description: Daily operational review, content: { application/json: { schema: { $ref: "#/components/schemas/GenericDataResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/admin/v1/ai-chatbot/conversations/{conversationId}/anonymize:
    post:
      tags: [AI Conversations]
      operationId: anonymizeAiConversation
      summary: Redact message content and identifying AI conversation summaries
      x-implementation-status: implemented
      x-target-sprint: 7
      x-permission: ai.privacy.manage
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200": { description: Conversation anonymized, content: { application/json: { schema: { $ref: "#/components/schemas/GenericDataResponse" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/v1/ai-chatbot/runtime/respond:
    post:
      tags: [AI Runtime]
      operationId: generateGroundedAiResponse
      summary: Generate a grounded response for an idempotent channel message
      description: |
        Internal service-to-service endpoint. Tenant is derived from the channel
        session mapping. A successful response is an approved candidate for the
        WhatsApp adapter; unsupported or failed retrieval returns a safe fallback.
      security:
        - serviceApiKey: []
      x-implementation-status: implemented
      x-target-sprint: 4
      x-permission: internal-service
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuntimeRespondRequest"
      responses:
        "200":
          description: Grounded answer or safe fallback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResultResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          description: Runtime rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"

  /api/admin/v1/ai-chatbot/handoffs:
    get:
      tags: [AI Runtime]
      operationId: listAiHandoffs
      summary: List tenant-scoped AI handoffs
      x-implementation-status: implemented
      x-target-sprint: 5
      x-permission: messages.read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: state
          in: query
          schema:
            type: string
            enum: [open, assigned, in_progress, resolved, closed, canceled, all]
      responses:
        "200":
          description: Tenant-scoped AI handoff page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandoffListResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/v1/ai-chatbot/handoffs/{handoffId}:
    get:
      tags: [AI Runtime]
      operationId: getAiHandoff
      summary: Return tenant-scoped AI handoff detail
      x-implementation-status: implemented
      x-target-sprint: 5
      x-permission: messages.read
      parameters:
        - $ref: "#/components/parameters/HandoffId"
      responses:
        "200":
          description: AI handoff detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HandoffResponse" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/v1/ai-chatbot/handoffs/{handoffId}/{transition}:
    post:
      tags: [AI Runtime]
      operationId: transitionAiHandoff
      summary: Assign, start, resolve, or close an AI handoff
      x-implementation-status: implemented
      x-target-sprint: 5
      x-permission: handoffs.manage
      parameters:
        - $ref: "#/components/parameters/HandoffId"
        - name: transition
          in: path
          required: true
          schema:
            type: string
            enum: [assign, in-progress, resolve, close]
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                assigneeUserId: { type: string, format: uuid }
                resolutionNote: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "200":
          description: Updated AI handoff
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HandoffResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/admin/v1/ai-chatbot/runtime/handoff:
    post:
      tags: [AI Runtime]
      operationId: createAiRuntimeHandoff
      summary: Idempotently create or return an existing handoff task
      description: >-
        Optional standalone service endpoint. Sprint 5 already creates the same
        handoff_tasks record atomically inside runtime/respond; this separately
        callable variant remains deferred.
      security:
        - serviceApiKey: []
      x-implementation-status: planned
      x-target-sprint: 5
      x-permission: internal-service
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuntimeHandoffRequest"
      responses:
        "200":
          description: Existing idempotent handoff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandoffResponse"
        "201":
          description: Handoff created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandoffResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: admin_session
      description: Existing opaque server-managed admin session.
    serviceApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Existing service-to-service credential; never used by browser code.

  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 512
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    HandoffId:
      name: handoffId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TestCaseId:
      name: testCaseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TraceId:
      name: traceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    PromptId:
      name: promptId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    KnowledgeId:
      name: knowledgeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UnansweredId:
      name: unansweredId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication is missing, invalid, or expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Tenant membership, permission, origin, or CSRF check failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource is absent from the current tenant
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Revision, lifecycle, idempotency, or processing-state conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    DependencyUnavailable:
      description: An enabled AI dependency is unavailable; no unsafe answer was generated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    RequestId:
      type: string
      format: uuid

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
            requestId:
              $ref: "#/components/schemas/RequestId"

    CapabilityState:
      type: string
      enum: [enabled, disabled, not_instrumented, unavailable]

    FoundationResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - apiVersion
            - phase
            - status
            - runtime
            - tenant
            - provider
            - infrastructure
            - guardrails
            - modules
          properties:
            apiVersion:
              type: string
              const: v1
            phase:
              type: string
              const: sprint_8
            status:
              type: string
              enum: [development_ready, blocked]
            runtime:
              type: object
              additionalProperties: false
              required: [enabled, customerTraffic, mode, sourceOfTruth, strictGrounding]
              properties:
                enabled:
                  type: boolean
                  const: false
                customerTraffic:
                  type: string
                  const: disabled
                mode:
                  type: string
                  const: rag
                sourceOfTruth:
                  type: string
                  const: knowledge_base
                strictGrounding:
                  type: boolean
            tenant:
              type: object
              additionalProperties: false
              required: [state, strategy, tenantId]
              properties:
                state:
                  $ref: "#/components/schemas/CapabilityState"
                strategy:
                  type: string
                  const: single_tenant_bootstrap
                tenantId:
                  type: [string, "null"]
                  format: uuid
            provider:
              type: object
              additionalProperties: false
              required:
                - state
                - name
                - chatModel
                - embeddingModel
                - secretReferenceConfigured
              properties:
                state:
                  $ref: "#/components/schemas/CapabilityState"
                name:
                  type: [string, "null"]
                chatModel:
                  type: [string, "null"]
                embeddingModel:
                  type: [string, "null"]
                secretReferenceConfigured:
                  type: boolean
            infrastructure:
              type: object
              additionalProperties: false
              required: [vectorStore, queue, objectStorage]
              properties:
                vectorStore:
                  $ref: "#/components/schemas/FoundationVectorStore"
                queue:
                  $ref: "#/components/schemas/FoundationQueue"
                objectStorage:
                  $ref: "#/components/schemas/FoundationObjectStorage"
            guardrails:
              type: object
              additionalProperties: false
              required:
                - faqOnly
                - booking
                - payments
                - diagnosis
                - personalizedMedicalAdvice
                - freeGenerationWithoutContext
                - fallbackAndHandoff
              properties:
                faqOnly:
                  type: boolean
                  const: true
                booking:
                  type: boolean
                  const: false
                payments:
                  type: boolean
                  const: false
                diagnosis:
                  type: boolean
                  const: false
                personalizedMedicalAdvice:
                  type: boolean
                  const: false
                freeGenerationWithoutContext:
                  type: boolean
                  const: false
                fallbackAndHandoff:
                  type: boolean
                  const: true
            modules:
              type: array
              minItems: 9
              maxItems: 9
              items:
                $ref: "#/components/schemas/FoundationModule"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    ResponseMeta:
      type: object
      additionalProperties: false
      required: [requestId, generatedAt]
      properties:
        requestId:
          type: string
        generatedAt:
          type: string
          format: date-time

    CursorResponseMeta:
      type: object
      additionalProperties: false
      required: [requestId, generatedAt, nextCursor]
      properties:
        requestId: { type: string }
        generatedAt: { type: string, format: date-time }
        nextCursor: { type: [string, "null"] }

    FoundationModule:
      type: object
      additionalProperties: false
      required: [key, label, path, state, targetSprint]
      properties:
        key:
          type: string
          enum:
            - overview
            - knowledge
            - instructions
            - playground
            - conversations
            - unanswered
            - handoffs
            - analytics
            - settings
        label:
          type: string
        path:
          type: string
          pattern: "^/ai-chatbot/"
        state:
          type: string
          enum: [available, planned]
        targetSprint:
          type: integer
          minimum: 0
          maximum: 8

    FoundationVectorStore:
      type: object
      additionalProperties: false
      required: [state, adapter]
      properties:
        state:
          $ref: "#/components/schemas/CapabilityState"
        adapter:
          type: string
          const: postgresql_pgvector

    FoundationQueue:
      type: object
      additionalProperties: false
      required: [state, adapter]
      properties:
        state:
          $ref: "#/components/schemas/CapabilityState"
        adapter:
          type: string
          const: redis

    FoundationObjectStorage:
      type: object
      additionalProperties: false
      required: [state, adapter]
      properties:
        state:
          $ref: "#/components/schemas/CapabilityState"
        adapter:
          type: string
          const: s3_compatible

    IntegrationSettings:
      type: object
      additionalProperties: false
      required:
        - id
        - tenantId
        - name
        - provider
        - chatModel
        - embeddingProvider
        - embeddingModel
        - embeddingDimensions
        - secretReferenceConfigured
        - active
        - effectiveEnabled
        - strictGrounding
        - maxResponseTokens
        - temperature
        - timeoutMs
        - retryCount
        - retrieval
        - featureFlags
        - revision
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        name:
          type: string
        provider:
          type: [string, "null"]
        chatModel:
          type: [string, "null"]
        embeddingProvider:
          type: [string, "null"]
        embeddingModel:
          type: [string, "null"]
        embeddingDimensions:
          type: [integer, "null"]
          minimum: 1
        secretReferenceConfigured:
          type: boolean
        active:
          type: boolean
        effectiveEnabled:
          type: boolean
          const: false
        strictGrounding:
          type: boolean
          const: true
        maxResponseTokens:
          type: integer
        temperature:
          type: number
        timeoutMs:
          type: integer
        retryCount:
          type: integer
        retrieval:
          $ref: "#/components/schemas/RetrievalSettings"
        featureFlags:
          $ref: "#/components/schemas/AiFeatureFlags"
        revision:
          type: integer
        updatedAt:
          type: string
          format: date-time

    IntegrationResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [integration, readiness]
          properties:
            integration:
              $ref: "#/components/schemas/IntegrationSettings"
            readiness:
              $ref: "#/components/schemas/AiReadiness"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    IntegrationUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - expectedRevision
        - name
        - provider
        - chatModel
        - embeddingProvider
        - embeddingModel
        - strictGrounding
        - maxResponseTokens
        - temperature
        - timeoutMs
        - retryCount
        - retrieval
        - featureFlags
      properties:
        expectedRevision:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 3
          maxLength: 150
        provider:
          type: string
          minLength: 1
          maxLength: 50
        chatModel:
          type: string
          minLength: 1
          maxLength: 100
        embeddingProvider:
          type: string
          minLength: 1
          maxLength: 50
        embeddingModel:
          type: string
          minLength: 1
          maxLength: 100
        embeddingDimensions:
          type: [integer, "null"]
          minimum: 1
          maximum: 10000
        apiKey:
          type: [string, "null"]
          minLength: 8
          maxLength: 500
          writeOnly: true
          description: Provider API key submitted once by an authorized Admin. The backend encrypts it at rest and never returns it.
        secretReference:
          type: [string, "null"]
          maxLength: 500
          deprecated: true
          description: Optional deployment-managed secret reference retained for compatibility. Cannot be sent together with apiKey.
          pattern: "^(env|vault|aws-secretsmanager|gcp-secretmanager|azure-keyvault)://"
        strictGrounding:
          type: boolean
          const: true
        maxResponseTokens:
          type: integer
          minimum: 50
          maximum: 2000
        temperature:
          type: number
          minimum: 0
          maximum: 1
        timeoutMs:
          type: integer
          minimum: 500
          maximum: 60000
        retryCount:
          type: integer
          minimum: 0
          maximum: 3
        retrieval:
          $ref: "#/components/schemas/RetrievalSettings"
        featureFlags:
          $ref: "#/components/schemas/AiFeatureFlags"

    RetrievalSettings:
      type: object
      additionalProperties: false
      required: [topK, finalContextCount, minimumSimilarity, maximumContextTokens, keywordSearchEnabled, rerankerEnabled]
      properties:
        topK:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
        finalContextCount:
          type: integer
          minimum: 1
          maximum: 10
        minimumSimilarity:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: Null until evaluated against the approved dataset.
        maximumContextTokens:
          type: [integer, "null"]
          minimum: 1
        keywordSearchEnabled:
          type: boolean
          default: false
        rerankerEnabled:
          type: boolean
          default: false

    AiFeatureFlags:
      type: object
      additionalProperties: false
      required: [documentUpload, autoHandoff, analytics]
      properties:
        documentUpload:
          type: boolean
        autoHandoff:
          type: boolean
        analytics:
          type: boolean

    AiDependencyState:
      type: string
      enum: [reachable, unreachable, not_configured, not_instrumented]

    AiReadiness:
      type: object
      additionalProperties: false
      required: [effectiveEnabled, blockers, dependencies, publishedPromptConfigured]
      properties:
        effectiveEnabled:
          type: boolean
          const: false
        blockers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, message]
            properties:
              code:
                type: string
              message:
                type: string
        dependencies:
          type: object
          additionalProperties: false
          required: [vectorStore, queue, objectStorage, chatProvider, embeddingProvider, checkedAt]
          properties:
            vectorStore:
              $ref: "#/components/schemas/AiDependencyState"
            queue:
              $ref: "#/components/schemas/AiDependencyState"
            objectStorage:
              $ref: "#/components/schemas/AiDependencyState"
            chatProvider:
              $ref: "#/components/schemas/AiDependencyState"
            embeddingProvider:
              $ref: "#/components/schemas/AiDependencyState"
            checkedAt:
              type: string
              format: date-time
        publishedPromptConfigured:
          type: boolean

    ActivationRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, acknowledgement]
      properties:
        expectedRevision:
          type: integer
          minimum: 1
        acknowledgement:
          type: string
          const: ACTIVATE_STRICT_GROUNDED_AI

    DeactivationRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, reason]
      properties:
        expectedRevision:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 5
          maxLength: 500

    ReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 5
          maxLength: 500

    PublishRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, changeReason]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        changeReason:
          type: string
          minLength: 5
          maxLength: 500

    ConnectionTestResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [chatProvider, embeddingProvider, testedAt]
          properties:
            chatProvider:
              type: string
              enum: [reachable, unreachable, invalid_configuration]
            embeddingProvider:
              type: string
              enum: [reachable, unreachable, invalid_configuration]
            testedAt:
              type: string
              format: date-time
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    PromptStatus:
      type: string
