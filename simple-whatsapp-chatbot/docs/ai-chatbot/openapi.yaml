openapi: 3.1.0
info:
  title: RAHO AI Chatbot Admin and Runtime API
  version: 0.9.0
  summary: Sprint 8 contract for evaluation, gated pilot, and launch readiness
  description: |
    This contract is additive to the existing WhatsApp Admin API. Sprint 1
    foundation, integration, and prompt operations, Sprint 2 category and
    manual knowledge governance, plus Sprint 3 document processing, chunking,
    embedding, strict-grounded RAG, deterministic safety pre-check/output
    validation, bounded memory, interest/admin detection, disclaimer, and
    idempotent handoff, evaluation reporting, UAT evidence gates, and staged
    pilot controls are implemented. Direct customer WhatsApp cutover remains disabled.

    Browser routes use the existing secure admin cookie, CSRF convention, and
    server-derived tenant context. Browser payloads never select tenant_id and
    never receive provider credentials.

    The deterministic rule engine remains under /api/admin/v1/chatbot/*.
    This specification owns only /api/admin/v1/ai-chatbot/*.
servers:
  - url: http://localhost:3000
    description: Local backend
tags:
  - name: AI Foundation
  - name: AI Integration
  - name: AI Prompts
  - name: AI Knowledge
  - name: AI Categories
  - name: AI Documents
  - name: AI Playground
  - name: AI Conversations
  - name: AI Unanswered
  - name: AI Analytics
  - name: AI Runtime
security:
  - sessionCookie: []

paths:
  /api/admin/v1/ai-chatbot/foundation:
    get:
      tags: [AI Foundation]
      operationId: getAiChatbotFoundation
      summary: Describe the implemented Sprint 1 shell, guardrails, and configured capability states
      description: |
        This read-only endpoint is implemented. Customer traffic remains
        disabled while Instructions and Settings are available for controlled
        configuration; response generation remains planned.
      x-implementation-status: implemented
      x-target-sprint: 0
      x-permission: ai.settings.read
      responses:
        "200":
          description: AI foundation snapshot without credentials or secret references
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoundationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/v1/ai-chatbot/integration:
    get:
      tags: [AI Integration]
      operationId: getAiIntegration
      summary: Read redacted integration settings for the current tenant
      x-implementation-status: implemented
      x-target-sprint: 1
      x-permission: ai.settings.read
      responses:
        "200":
          description: Redacted integration settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [AI Integration]
      operationId: updateAiIntegration
      summary: Update integration settings without activating the integration
      x-implementation-status: implemented
      x-target-sprint: 1
      x-permission: ai.settings.manage
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationUpdateRequest"
      responses:
        "200":
          description: Updated redacted settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/admin/v1/ai-chatbot/integration/activate:
    post:
      tags: [AI Integration]
      operationId: activateAiIntegration
      summary: Activate AI after every readiness and approval guard passes
      x-implementation-status: implemented
      x-target-sprint: 1
      x-permission: ai.settings.manage
      description: Implemented as a fail-closed gate; Sprint 1 always rejects activation while the global release hard-off remains in force.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivationRequest"
      responses:
        "200":
          description: Integration activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"

  /api/admin/v1/ai-chatbot/integration/deactivate:
    post:
      tags: [AI Integration]
      operationId: deactivateAiIntegration
      summary: Disable new AI responses for the current tenant
      x-implementation-status: implemented
      x-target-sprint: 1
      x-permission: ai.settings.manage
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeactivationRequest"
      responses:
        "200":
          description: Integration deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/v1/ai-chatbot/integration/test-connection:
    post:
      tags: [AI Integration]
      operationId: testAiProviderConnection
      summary: Test configured provider references without returning a secret
      x-implementation-status: implemented
      x-target-sprint: 1
      x-permission: ai.settings.manage
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Provider and model reachability result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionTestResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"

  /api/admin/v1/ai-chatbot/prompts:
    get:
      tags: [AI Prompts]
      operationId: listAiPromptVersions
      summary: List prompt versions for the current tenant
      x-implementation-status: implemented
      x-target-sprint: 1
      x-permission: ai.prompts.read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Prompt version page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [AI Prompts]
      operationId: createAiPromptVersion
      summary: Create a draft prompt version
      x-implementation-status: implemented
      x-target-sprint: 1
      x-permission: ai.prompts.manage
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptCreateRequest"
      responses:
        "201":
          description: Draft prompt created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/v1/ai-chatbot/prompts/{promptId}/approve:
    post:
      tags: [AI Prompts]
      operationId: approveAiPromptVersion
      summary: Approve an immutable draft prompt version
      x-implementation-status: implemented
      x-target-sprint: 1
      x-permission: ai.prompts.approve
      parameters:
        - $ref: "#/components/parameters/PromptId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishRequest"
      responses:
        "200":
          description: Approved prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/admin/v1/ai-chatbot/prompts/{promptId}/publish:
    post:
      tags: [AI Prompts]
      operationId: publishAiPromptVersion
      summary: Publish an approved immutable prompt version
      x-implementation-status: implemented
      x-target-sprint: 1
      x-permission: ai.prompts.manage
      parameters:
        - $ref: "#/components/parameters/PromptId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishRequest"
      responses:
        "200":
          description: Published prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/admin/v1/ai-chatbot/categories:
    get:
      tags: [AI Categories]
      operationId: listKnowledgeCategories
      summary: List tenant-scoped knowledge categories
      x-implementation-status: implemented
      x-target-sprint: 2
      x-permission: knowledge.read
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [AI Categories]
      operationId: createKnowledgeCategory
      summary: Create a knowledge category
      x-implementation-status: implemented
      x-target-sprint: 2
      x-permission: knowledge.categories.manage
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryWriteRequest"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/admin/v1/ai-chatbot/categories/{categoryId}:
