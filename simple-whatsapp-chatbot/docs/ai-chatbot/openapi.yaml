      operationId: updateKnowledgeCategory
      summary: Update one tenant-scoped category
      x-implementation-status: implemented
      x-target-sprint: 2
      x-permission: knowledge.categories.manage
      parameters:
        - $ref: "#/components/parameters/CategoryId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdateRequest"
      responses:
        "200":
          description: Category updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [AI Categories]
      operationId: deleteKnowledgeCategory
      summary: Delete an unused category or reject when referenced
      x-implementation-status: implemented
      x-target-sprint: 2
      x-permission: knowledge.categories.manage
      parameters:
        - $ref: "#/components/parameters/CategoryId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Category deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/admin/v1/ai-chatbot/knowledge:
    get:
      tags: [AI Knowledge]
      operationId: listKnowledgeItems
      summary: Search tenant-scoped knowledge
      x-implementation-status: implemented
      x-target-sprint: 2
      x-permission: knowledge.read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: query
          in: query
          schema:
            type: string
            maxLength: 100
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/KnowledgeStatus"
        - name: sourceType
          in: query
          schema:
            $ref: "#/components/schemas/KnowledgeSourceType"
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: expired
          in: query
          schema:
            type: boolean
        - name: requiresDisclaimer
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Knowledge page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [AI Knowledge]
      operationId: createKnowledgeItem
      summary: Create a draft FAQ or Markdown article
      x-implementation-status: implemented
      x-target-sprint: 2
      x-permission: knowledge.edit
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeWriteRequest"
      responses:
        "201":
          description: Draft knowledge created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/v1/ai-chatbot/knowledge/{knowledgeId}:
    get:
      tags: [AI Knowledge]
      operationId: getKnowledgeItem
      summary: Read one knowledge item and current version
      x-implementation-status: implemented
      x-target-sprint: 2
      x-permission: knowledge.read
      parameters:
        - $ref: "#/components/parameters/KnowledgeId"
      responses:
        "200":
          description: Knowledge detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [AI Knowledge]
      operationId: updateKnowledgeItem
      summary: Create or update a draft knowledge version
      x-implementation-status: implemented
      x-target-sprint: 2
      x-permission: knowledge.edit
      parameters:
        - $ref: "#/components/parameters/KnowledgeId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeUpdateRequest"
      responses:
        "200":
          description: Draft updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [AI Knowledge]
      operationId: deleteKnowledgeDraft
      summary: Delete a draft only; published history is retained
      x-implementation-status: implemented
      x-target-sprint: 2
      x-permission: knowledge.edit
      parameters:
        - $ref: "#/components/parameters/KnowledgeId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Draft deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/admin/v1/ai-chatbot/knowledge/bulk-action:
    post:
      tags: [AI Knowledge]
      operationId: bulkKnowledgeAction
      summary: Atomically publish or archive up to 50 knowledge items
      x-implementation-status: implemented
      x-target-sprint: 2
      x-permission: knowledge.publish
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeBulkActionRequest"
      responses:
        "200":
          description: Updated knowledge items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBulkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/admin/v1/ai-chatbot/knowledge/{knowledgeId}/submit-review:
    post:
      tags: [AI Knowledge]
      operationId: submitKnowledgeForReview
      summary: Move the current draft into review
      x-implementation-status: implemented
      x-target-sprint: 2
      x-permission: knowledge.edit
      parameters:
        - $ref: "#/components/parameters/KnowledgeId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeLifecycleRequest"
      responses:
        "200":
          description: Knowledge submitted for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/admin/v1/ai-chatbot/knowledge/{knowledgeId}/request-revision:
    post:
      tags: [AI Knowledge]
      operationId: requestKnowledgeRevision
      summary: Return a review item to draft with an internal reason
      x-implementation-status: implemented
      x-target-sprint: 2
      x-permission: knowledge.review
      parameters:
        - $ref: "#/components/parameters/KnowledgeId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeLifecycleRequest"
      responses:
        "200":
          description: Revision requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/admin/v1/ai-chatbot/knowledge/{knowledgeId}/approve:
    post:
      tags: [AI Knowledge]
      operationId: approveKnowledgeItem
      summary: Approve a reviewed immutable knowledge version
      x-implementation-status: implemented
      x-target-sprint: 2
      x-permission: knowledge.review
      parameters:
        - $ref: "#/components/parameters/KnowledgeId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeLifecycleRequest"
      responses:
        "200":
          description: Knowledge approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/admin/v1/ai-chatbot/knowledge/{knowledgeId}/publish:
    post:
      tags: [AI Knowledge]
      operationId: publishKnowledgeItem
      summary: Publish an approved immutable knowledge version
      description: Indexing is deliberately deferred to Sprint 3.
      x-implementation-status: implemented
      x-target-sprint: 2
      x-permission: knowledge.publish
      parameters:
        - $ref: "#/components/parameters/KnowledgeId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeLifecycleRequest"
      responses:
        "200":
          description: Published; indexing remains pending Sprint 3
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/admin/v1/ai-chatbot/knowledge/{knowledgeId}/archive:
    post:
      tags: [AI Knowledge]
      operationId: archiveKnowledgeItem
      summary: Archive published knowledge and remove it from retrieval
      x-implementation-status: implemented
      x-target-sprint: 2
      x-permission: knowledge.publish
      parameters:
        - $ref: "#/components/parameters/KnowledgeId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeLifecycleRequest"
      responses:
        "200":
          description: Knowledge archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/admin/v1/ai-chatbot/knowledge/{knowledgeId}/reindex:
    post:
      tags: [AI Knowledge]
      operationId: reindexKnowledgeItem
      summary: Enqueue idempotent re-indexing of the published version
      x-implementation-status: implemented
      x-target-sprint: 3
      x-permission: knowledge.publish
      parameters:
        - $ref: "#/components/parameters/KnowledgeId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "202":
          description: Re-index queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeReindexResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/admin/v1/ai-chatbot/documents:
