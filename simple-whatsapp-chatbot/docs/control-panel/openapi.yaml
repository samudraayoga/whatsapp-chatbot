        displayName:
          type: [string, "null"]
        maskedPhone:
          type: [string, "null"]
        identityStatus:
          type: string
          enum: [resolved, unresolved, conflict]
        lastMessage:
          type: object
          additionalProperties: false
          required: [id, preview, direction, messageType, occurredAt]
          properties:
            id:
              type: string
            preview:
              type: string
            direction:
              type: string
              enum: [incoming, outgoing]
            messageType:
              type: string
            occurredAt:
              type: string
              format: date-time
        lastOutgoingStatus:
          type: [string, "null"]
        counts:
          $ref: "#/components/schemas/MessageCounts"

    ConversationListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ConversationSummary"
        meta:
          $ref: "#/components/schemas/CursorMeta"

    Handoff:
      type: object
      additionalProperties: false
      required:
        - id
        - contactId
        - sourceMessageId
        - state
        - assigneeUserId
        - dueAt
        - resolvedAt
        - resolutionNote
        - tenantId
        - aiConversationId
        - aiMessageTraceId
        - reason
        - priority
        - summary
        - knowledgeIds
        - safetyCategory
        - traceId
        - createdAt
        - updatedAt
        - contact
        - sourcePreview
      properties:
        id:
          type: string
          format: uuid
        contactId:
          type: string
        sourceMessageId:
          type: string
        state:
          type: string
          enum: [open, assigned, in_progress, resolved, closed, canceled]
        assigneeUserId:
          type: [string, "null"]
          format: uuid
        dueAt:
          type: [string, "null"]
          format: date-time
        resolvedAt:
          type: [string, "null"]
          format: date-time
        resolutionNote:
          type: [string, "null"]
        tenantId:
          type: [string, "null"]
          format: uuid
        aiConversationId:
          type: [string, "null"]
          format: uuid
        aiMessageTraceId:
          type: [string, "null"]
          format: uuid
        reason:
          type: [string, "null"]
        priority:
          type: string
          enum: [normal, high]
        summary:
          type: [string, "null"]
        knowledgeIds:
          type: array
          items:
            type: string
        safetyCategory:
          type: [string, "null"]
        traceId:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        contact:
          type: object
          additionalProperties: false
          required: [displayName, maskedPhone]
          properties:
            displayName:
              type: [string, "null"]
            maskedPhone:
              type: [string, "null"]
        sourcePreview:
          type: string

    MessageCounts:
      type: object
      additionalProperties: false
      required: [incoming, outgoing]
      properties:
        incoming:
          type: integer
          minimum: 0
        outgoing:
          type: integer
          minimum: 0

    Contact:
      type: object
      additionalProperties: false
      required:
        - id
        - displayName
        - maskedPhone
        - identity
        - counts
        - lastOutgoingStatus
        - lastInteractionAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        displayName:
          type: [string, "null"]
        maskedPhone:
          type: [string, "null"]
        identity:
          type: object
          additionalProperties: false
          required: [status, whatsappJid, pnJid, lidJid, canonicalJid]
          properties:
            status:
              type: string
              enum: [resolved, unresolved, conflict]
            whatsappJid:
              type: [string, "null"]
            pnJid:
              type: [string, "null"]
            lidJid:
              type: [string, "null"]
            canonicalJid:
              type: [string, "null"]
        counts:
          $ref: "#/components/schemas/MessageCounts"
        lastOutgoingStatus:
          type: [string, "null"]
        lastInteractionAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ContactResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Contact"
        meta:
          $ref: "#/components/schemas/Meta"

    ContactListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Contact"
        meta:
          $ref: "#/components/schemas/CursorMeta"

    HandoffResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Handoff"
        meta:
          $ref: "#/components/schemas/Meta"

    HandoffListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Handoff"
        meta:
          $ref: "#/components/schemas/CursorMeta"

    SessionResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [session, readiness]
          properties:
            session:
              $ref: "#/components/schemas/SessionSnapshot"
            readiness:
              $ref: "#/components/schemas/Readiness"
        meta:
          $ref: "#/components/schemas/Meta"

    QrResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [qr, expiresAt]
          properties:
            qr:
              type: string
              writeOnly: true
            expiresAt:
              type: string
              format: date-time
        meta:
          $ref: "#/components/schemas/Meta"

    SafetyResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/SafetyCenterData"
        meta:
          $ref: "#/components/schemas/Meta"

    SafetyCenterData:
      type: object
      additionalProperties: true
      required:
        - effectivePaused
        - manualPaused
        - mode
        - blockers
        - health
        - rates
        - warmup
        - timelock
        - recovery
        - delivery
        - retry
        - reconnect
        - sessionStability
        - recentDelays
        - config
        - capabilities
      properties:
        effectivePaused:
          type: boolean
        manualPaused:
          type: boolean
        mode:
          type: string
          enum: [manual_pause, auto_pause, recovery_pause, active, unavailable]
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/SafetyBlocker"
        health:
          allOf:
            - $ref: "#/components/schemas/SafetyFeature"
            - type: object
              required: [risk, score, reasons, recommendation]
              properties:
                risk:
                  type: string
                  enum: [low, medium, high, critical, unknown]
                score:
                  type: [number, "null"]
                  minimum: 0
                  maximum: 100
                autoPauseAt:
                  type: [string, "null"]
                reasons:
                  type: array
                  items:
                    type: string
                recommendation:
                  type: string
                stats:
                  type: [object, "null"]
        rates:
          allOf:
            - $ref: "#/components/schemas/SafetyFeature"
            - type: object
              properties:
                minute:
                  $ref: "#/components/schemas/SafetyRateWindow"
                hour:
                  $ref: "#/components/schemas/SafetyRateWindow"
                day:
                  $ref: "#/components/schemas/SafetyRateWindow"
        warmup:
          allOf:
            - $ref: "#/components/schemas/SafetyFeature"
            - type: object
              properties:
                data:
                  type: [object, "null"]
                  properties:
                    day:
                      type: integer
                    totalDays:
                      type: integer
                    sentToday:
                      type: integer
                    limitToday:
                      type: integer
                    remainingToday:
                      type: integer
                    progressRatio:
                      type: number
                      minimum: 0
                      maximum: 1
        timelock:
          allOf:
            - $ref: "#/components/schemas/SafetyFeature"
            - type: object
              properties:
                active:
                  type: [boolean, "null"]
                enforcementType:
                  type: [string, "null"]
                detectedAt:
                  type: [string, "null"]
                  format: date-time
                expiresAt:
                  type: [string, "null"]
                  format: date-time
                errorCount:
                  type: integer
        recovery:
          allOf:
            - $ref: "#/components/schemas/SafetyFeature"
            - type: object
              required: [resetEligible]
              properties:
                phase:
                  type: [string, "null"]
                rateMultiplier:
                  type: [number, "null"]
                pauseRemainingMs:
                  type: [number, "null"]
                pauseUntil:
                  type: [string, "null"]
                  format: date-time
                estimatedFullRecoveryAt:
                  type: [string, "null"]
                  format: date-time
                recommendation:
                  type: [string, "null"]
                shouldReplaceNumber:
                  type: [boolean, "null"]
                resetEligible:
                  type: boolean
        delivery:
          allOf:
            - $ref: "#/components/schemas/SafetyFeature"
            - type: object
              properties:
                data:
                  type: [object, "null"]
                  properties:
                    sentInWindow:
                      type: integer
                    deliveredInWindow:
                      type: integer
                    deliveryRate:
                      type: [number, "null"]
                    sampleState:
                      type: string
                      enum: [available, insufficient_sample]
                    windowMs:
                      type: number
        retry:
          $ref: "#/components/schemas/SafetyOptionalFeature"
        reconnect:
          $ref: "#/components/schemas/SafetyOptionalFeature"
        sessionStability:
          $ref: "#/components/schemas/SafetyOptionalFeature"
        counters:
          type: [object, "null"]
          properties:
            messagesAllowed:
              type: integer
            messagesBlocked:
              type: integer
            totalDelayMs:
              type: number
        recentDelays:
          type: array
          items:
            $ref: "#/components/schemas/SafetyDelayEvent"
        config:
          $ref: "#/components/schemas/SafetyConfig"
        capabilities:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/SafetyFeature"
        snapshot:
          $ref: "#/components/schemas/SafetySnapshot"

    SafetyFeature:
      type: object
      required: [state, reason]
      properties:
        state:
          type: string
          enum: [enabled, disabled, not_instrumented, unavailable]
        reason:
          type: [string, "null"]

    SafetyOptionalFeature:
      allOf:
        - $ref: "#/components/schemas/SafetyFeature"
        - type: object
          required: [data]
          properties:
            data:
              type: [object, "null"]

    SafetyBlocker:
      type: object
      additionalProperties: false
      required: [code, source, message, recommendation, retryAt]
      properties:
        code:
          type: string
        source:
          type: string
        message:
          type: string
        recommendation:
          type: string
        retryAt:
          type: [string, "null"]
          format: date-time

    SafetyRateWindow:
      type: [object, "null"]
      properties:
        used:
          type: number
        limit:
          type: number
        utilization:
          type: number
          minimum: 0
          maximum: 1

    SafetyDelayEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - messageId
        - outboxId
        - reasonCode
        - message
        - recommendation
        - nextAttemptInMs
        - occurredAt
      properties:
        id:
          type: string
        messageId:
          type: string
          format: uuid
        outboxId:
          type: [string, "null"]
          format: uuid
        reasonCode:
          type: string
        message:
          type: [string, "null"]
        recommendation:
          type: [string, "null"]
        nextAttemptInMs:
          type: [number, "null"]
        occurredAt:
          type: string
          format: date-time

    SafetyConfig:
      type: object
      required: [state, preset, mutable, values]
      properties:
        state:
          type: string
          enum: [enabled, disabled, not_instrumented, unavailable]
        preset:
          type: string
          enum: [conservative]
        mutable:
          type: boolean
        values:
          type: [object, "null"]
          properties:
            perMinute:
              type: number
            perHour:
              type: number
            perDay:
              type: number
            minDelayMs:
              type: number
            maxDelayMs:
              type: number
            newChatDelayMs:
              type: number
            warmupDays:
              type: integer
            autoPauseAt:
              type: string

    ReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 5
          maxLength: 500

    SafetyResumeRequest:
      type: object
      additionalProperties: false
      required: [reason, currentPassword, acknowledgement]
      properties:
        reason:
          type: string
          minLength: 5
          maxLength: 500
        currentPassword:
          type: string
          writeOnly: true
          maxLength: 256
        acknowledgement:
          type: string
          enum: [I_UNDERSTAND_THE_RISK]

    SafetyResetRequest:
      type: object
      additionalProperties: false
      required: [reason, currentPassword, confirmation]
      properties:
        reason:
          type: string
          minLength: 5
          maxLength: 500
        currentPassword:
          type: string
          writeOnly: true
          maxLength: 256
        confirmation:
          type: string
          enum: [RESET_SAFETY_STATE]
