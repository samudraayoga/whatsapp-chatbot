          format: date-time
        queuedAt:
          type: [string, "null"]
          format: date-time
        sendingAt:
          type: [string, "null"]
          format: date-time
        sentAt:
          type: [string, "null"]
          format: date-time
        deliveredAt:
          type: [string, "null"]
          format: date-time
        readAt:
          type: [string, "null"]
          format: date-time
        failedAt:
