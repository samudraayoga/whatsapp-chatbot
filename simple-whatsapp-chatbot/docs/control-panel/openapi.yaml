openapi: 3.1.0
info:
  title: WhatsApp Chatbot Admin API
  version: 0.9.0
  summary: Admin contract for the WhatsApp control panel
  description: |
    The chatbot editor exposes one active configuration with optimistic
    concurrency, unsaved-rule preview, atomic save, and audit. Safety controls
    and one-click WhatsApp credential reset/re-pair remain protected.
    Browser clients authenticate using a secure server-managed session cookie.
    The canonical detailed contract for /api/admin/v1/ai-chatbot/* Sprint 8
    operations is maintained in ../ai-chatbot/openapi.yaml.
servers:
  - url: http://localhost:3000
    description: Local backend
tags:
  - name: Identity
  - name: Overview
  - name: Messages
  - name: Conversations
  - name: Contacts
  - name: Handoffs
  - name: Session
  - name: Safety
  - name: Events
  - name: Chatbot
  - name: AI Chatbot
security:
  - sessionCookie: []

paths:
  /health/live:
    get:
      tags: [Overview]
      operationId: getLiveness
      summary: Confirm that the HTTP process is live
      security: []
      x-sprint: 1
      responses:
        "200":
          description: Process is live

  /health/ready:
    get:
      tags: [Overview]
      operationId: getReadiness
      summary: Report database and WhatsApp readiness independently
      security: []
      x-sprint: 1
      responses:
        "200":
          description: Required dependencies are ready
        "503":
          description: At least one required dependency is unavailable

  /api/admin/v1/auth/login:
    post:
      tags: [Identity]
      operationId: loginAdmin
      summary: Create an opaque server-managed admin session
      security: []
      x-sprint: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded; session and CSRF cookies are set
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAdminResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Too many failed login attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/admin/v1/auth/logout:
    post:
      tags: [Identity]
      operationId: logoutAdmin
      summary: Revoke the current session and clear its cookies
      x-sprint: 1
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Session revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/v1/me:
    get:
      tags: [Identity]
      operationId: getCurrentAdmin
      summary: Return the authenticated admin and permissions
      x-sprint: 1
      responses:
        "200":
          description: Current identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAdminResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/admin/v1/overview:
    get:
      tags: [Overview]
      operationId: getOverview
      summary: Return an operational snapshot for the control room
      x-sprint: 1
      responses:
        "200":
          description: Current operational snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverviewResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/v1/conversations:
    get:
      tags: [Conversations]
      operationId: listConversations
      summary: List conversation summaries using cursor pagination
      x-sprint: 3
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: query
          in: query
          schema:
            type: string
            maxLength: 100
        - name: status
          in: query
          schema:
            type: string
            enum: [all, has_failure, identity_warning]
      responses:
        "200":
          description: Conversation page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/v1/conversations/{conversationId}/messages:
    get:
      tags: [Conversations]
      operationId: listConversationMessages
      summary: List messages for one conversation
      x-sprint: 3
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Message page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/admin/v1/contacts:
    get:
      tags: [Contacts]
      operationId: listContacts
      summary: Search contacts using stable cursor pagination
      x-sprint: 3
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: query
          in: query
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: Contact page with masked identity fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/v1/contacts/{contactId}:
    get:
      tags: [Contacts]
      operationId: getContact
      summary: Return one contact and its identity facade
      x-sprint: 3
      parameters:
        - $ref: "#/components/parameters/ContactId"
      responses:
        "200":
          description: Contact detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/admin/v1/messages:
    post:
      tags: [Messages]
      operationId: createMessage
      summary: Accept an idempotent outbound message command
      description: |
        A successful response means accepted into the durable outbox, not sent to
        WhatsApp. Reusing the same key and payload returns the same logical result.
      x-sprint: 4
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageRequest"
      responses:
        "202":
          description: Message accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateMessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Idempotency key was reused with a different payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "423":
          description: Sending is blocked by an operational policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/admin/v1/messages/{messageId}:
    get:
      tags: [Messages]
      operationId: getMessage
      summary: Return a logical message and immutable event timeline
      x-sprint: 4
      parameters:
        - $ref: "#/components/parameters/MessageId"
      responses:
        "200":
          description: Message detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/admin/v1/outbox:
    get:
      tags: [Messages]
      operationId: listOutbox
      summary: List durable outbox items
      x-sprint: 4
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: state
          in: query
          schema:
            oneOf:
              - $ref: "#/components/schemas/OutboxState"
              - const: all
      responses:
        "200":
          description: Outbox page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboxListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/v1/outbox/{outboxId}/cancel:
    post:
      tags: [Messages]
      operationId: cancelOutboxItem
      summary: Cancel an item before provider processing begins
      x-sprint: 4
      parameters:
        - $ref: "#/components/parameters/OutboxId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Item canceled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboxTransitionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/admin/v1/outbox/{outboxId}/retry:
    post:
      tags: [Messages]
      operationId: retryOutboxItem
      summary: Requeue a known failed item while preserving logical lineage
      description: unknown_outcome cannot be retried without reconciliation.
      x-sprint: 4
      parameters:
        - $ref: "#/components/parameters/OutboxId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  maxLength: 500
      responses:
        "200":
          description: Item requeued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboxTransitionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/admin/v1/outbox/{outboxId}/reconcile:
    post:
      tags: [Messages]
      operationId: reconcileOutboxItem
      summary: Reconcile an ambiguous provider outcome
      description: Admin-only operation backed by external provider/device evidence.
      x-sprint: 4
      parameters:
        - $ref: "#/components/parameters/OutboxId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [resolution, note]
              properties:
                resolution:
                  type: string
                  enum: [confirmed_sent, confirmed_not_sent]
                providerMessageId:
                  type: string
                  maxLength: 255
                note:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        "200":
          description: Ambiguous outcome reconciled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/admin/v1/handoffs:
    get:
      tags: [Handoffs]
      operationId: listHandoffs
      summary: List human follow-up tasks
      x-sprint: 3
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: state
          in: query
          schema:
            type: string
            enum: [open, assigned, in_progress, resolved, closed, canceled]
      responses:
        "200":
          description: Handoff page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandoffListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/v1/handoffs/{handoffId}:
    get:
      tags: [Handoffs]
      operationId: getHandoff
      summary: Return handoff detail including AI safety metadata
      x-sprint: 5
      parameters:
        - $ref: "#/components/parameters/HandoffId"
      responses:
        "200":
          description: Handoff detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandoffResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/admin/v1/handoffs/{handoffId}/assign:
    post:
      tags: [Handoffs]
      operationId: assignHandoff
      summary: Claim or assign a follow-up task
      x-sprint: 3
      parameters:
        - $ref: "#/components/parameters/HandoffId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                assigneeUserId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Updated handoff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandoffResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/admin/v1/handoffs/{handoffId}/resolve:
    post:
      tags: [Handoffs]
      operationId: resolveHandoff
      summary: Resolve a follow-up task
      x-sprint: 3
      parameters:
        - $ref: "#/components/parameters/HandoffId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [resolutionNote]
              properties:
                resolutionNote:
                  type: string
                  minLength: 1
                  maxLength: 1000
      responses:
        "200":
          description: Resolved handoff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandoffResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/admin/v1/handoffs/{handoffId}/in-progress:
    post:
      tags: [Handoffs]
      operationId: startHandoff
      summary: Mark a claimed handoff in progress
      x-sprint: 5
      parameters:
        - $ref: "#/components/parameters/HandoffId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Updated handoff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandoffResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/admin/v1/handoffs/{handoffId}/close:
    post:
      tags: [Handoffs]
      operationId: closeHandoff
      summary: Close a completed handoff
      x-sprint: 5
      parameters:
        - $ref: "#/components/parameters/HandoffId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [resolutionNote]
              properties:
                resolutionNote:
                  type: string
                  minLength: 1
                  maxLength: 1000
      responses:
        "200":
          description: Closed handoff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandoffResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/admin/v1/session:
    get:
      tags: [Session]
      operationId: getSession
      summary: Return rich session and send-readiness state
      x-sprint: 2
      responses:
        "200":
          description: Session snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/v1/session/qr:
    get:
      tags: [Session]
      operationId: getPairingQr
      summary: Return a short-lived pairing QR only when required
      description: Raw QR content must never be logged or persisted in the general database.
      x-sprint: 2
      responses:
        "200":
          description: Ephemeral QR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QrResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/admin/v1/session/reconnect:
    post:
      tags: [Session]
      operationId: reconnectSession
      summary: Request a guarded reconnect
      x-sprint: 2
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "202":
          description: Reconnect command accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/admin/v1/session/reset:
    post:
      tags: [Session]
      operationId: resetWhatsAppSession
      summary: Delete WhatsApp credentials and start a new QR pairing
      description: |
        Admin-only destructive recovery for a connected session, a
        logged-out/bad-session state, or a fatal disconnected state. Resetting a
        connected session closes the active socket before deleting its credentials.
        Persisted anti-ban safety state, message history, contacts, chatbot rules,
        and audit logs are not deleted. The authenticated Admin's action is recorded
        in the audit log; no request body is required.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "202":
          description: Credentials reset and pairing startup accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/admin/v1/safety/stats:
    get:
      tags: [Safety]
      operationId: getSafetyStats
      summary: Return normalized anti-ban stats and capability states
      x-sprint: 6
      responses:
        "200":
          description: Safety snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/v1/safety/pause:
    post:
      tags: [Safety]
      operationId: pauseSending
      summary: Emergency pause outbound sending
      x-sprint: 2
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "200":
          description: Effective pause state after the command
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/v1/safety/resume:
    post:
      tags: [Safety]
      operationId: resumeSending
      summary: Request resume and return the effective state
      description: Manual resume may remain effectively paused due to health or recovery policy.
      x-sprint: 6
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SafetyResumeRequest"
      responses:
        "200":
          description: Effective safety state after the command
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "423":
          description: Automatic safety policy still blocks sending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/admin/v1/safety/reset:
    post:
      tags: [Safety]
      operationId: resetSafetyState
      summary: Reset eligible safety state while keeping sending manually paused
      description: Disabled unless SAFETY_RESET_ENABLED=true and no recovery/timelock guard is active.
      x-sprint: 6
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SafetyResetRequest"
      responses:
        "200":
          description: Reset completed; sending remains manually paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Safety reset is disabled by configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "423":
          description: Recovery or timelock guard prevents reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/admin/v1/safety/metrics:
    get:
      tags: [Safety]
      operationId: getSafetyMetrics
      summary: Export normalized control-panel safety metrics
      x-sprint: 6
      responses:
        "200":
          description: Prometheus text exposition; unavailable module values are omitted
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/v1/events/stream:
    get:
      tags: [Events]
      operationId: streamOperationalEvents
      summary: Stream session, safety, message, and incident events
      x-sprint: 2
      parameters:
        - name: Last-Event-ID
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Server-Sent Event stream
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/admin/v1/chatbot/config:
    get:
      tags: [Chatbot]
      operationId: getChatbotConfig
      summary: Read the single active chatbot configuration
      x-sprint: 5
      responses:
        "200":
          description: Active configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatbotConfigResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    put:
      tags: [Chatbot]
      operationId: updateChatbotConfig
      summary: Atomically validate, save, and activate the complete rule set
      x-sprint: 5
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatbotConfigUpdateRequest"
      responses:
        "200":
          description: Active configuration with an incremented revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatbotConfigResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/admin/v1/ai-chatbot/foundation:
    get:
      tags: [AI Chatbot]
      operationId: getAiChatbotFoundation
      summary: Read the fail-closed Sprint 2 RAG foundation and module roadmap
      description: |
        Sprint 2 discovery endpoint. It never returns provider secrets and does
        not activate customer traffic. Tenant context and granular AI
        permissions are enforced server-side.
      x-sprint: 2
      responses:
        "200":
          description: Current foundation contract and non-secret readiness state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChatbotFoundationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

