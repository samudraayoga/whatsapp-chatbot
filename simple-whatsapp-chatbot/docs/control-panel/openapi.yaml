  /api/admin/v1/chatbot/test:
    post:
      tags: [Chatbot]
      operationId: testChatbotRules
      summary: Preview unsaved candidate rules without activating them
      x-sprint: 5
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [input, rules]
              properties:
                input:
                  type: string
                  maxLength: 4096
                rules:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    $ref: "#/components/schemas/ChatbotRule"
      responses:
        "200":
          description: Exact normalized match and response preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatbotTestResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: admin_session
    serviceApiKey:
      type: apiKey
      in: header
      name: X-API-Key

  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        pattern: '^\d+$'
    ContactId:
      name: contactId
      in: path
      required: true
      schema:
        type: string
        pattern: '^\d+$'
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    HandoffId:
      name: handoffId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OutboxId:
      name: outboxId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The current identity lacks permission
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    StateConflict:
      description: Resource state does not allow this transition
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    AiChatbotModule:
      type: object
      additionalProperties: false
      required: [key, label, path, state, targetSprint]
      properties:
        key:
          type: string
          enum:
            [overview, knowledge, instructions, playground, conversations,
             unanswered, handoffs, analytics, settings]
        label:
          type: string
        path:
          type: string
          pattern: '^/ai-chatbot/'
        state:
          type: string
          enum: [available, planned]
        targetSprint:
          type: integer
          minimum: 0
          maximum: 8

    AiChatbotFoundationResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            [apiVersion, phase, status, runtime, tenant, provider,
             infrastructure, guardrails, modules]
          properties:
            apiVersion:
              const: v1
            phase:
              const: sprint_8
            status:
              type: string
              enum: [development_ready, blocked]
            runtime:
              type: object
              additionalProperties: false
              required:
                [enabled, customerTraffic, mode, sourceOfTruth, strictGrounding]
              properties:
                enabled:
                  const: false
                customerTraffic:
                  const: disabled
                mode:
                  const: rag
                sourceOfTruth:
                  const: knowledge_base
                strictGrounding:
                  type: boolean
            tenant:
              type: object
              additionalProperties: false
              required: [state, strategy, tenantId]
              properties:
                state:
                  $ref: "#/components/schemas/CapabilityState"
                strategy:
                  const: single_tenant_bootstrap
                tenantId:
                  type: [string, "null"]
                  format: uuid
            provider:
              type: object
              additionalProperties: false
              required:
                [state, name, chatModel, embeddingModel,
                 secretReferenceConfigured]
              properties:
                state:
                  $ref: "#/components/schemas/CapabilityState"
                name:
                  type: [string, "null"]
                chatModel:
                  type: [string, "null"]
                embeddingModel:
                  type: [string, "null"]
                secretReferenceConfigured:
                  type: boolean
            infrastructure:
              type: object
              additionalProperties: false
              required: [vectorStore, queue, objectStorage]
              properties:
                vectorStore:
                  type: object
                  additionalProperties: false
                  required: [state, adapter]
                  properties:
                    state:
                      $ref: "#/components/schemas/CapabilityState"
                    adapter:
                      const: postgresql_pgvector
                queue:
                  type: object
                  additionalProperties: false
                  required: [state, adapter]
                  properties:
                    state:
                      $ref: "#/components/schemas/CapabilityState"
                    adapter:
                      const: redis
                objectStorage:
                  type: object
                  additionalProperties: false
                  required: [state, adapter]
                  properties:
                    state:
                      $ref: "#/components/schemas/CapabilityState"
                    adapter:
                      const: s3_compatible
            guardrails:
              type: object
              additionalProperties: false
              required:
                [faqOnly, booking, payments, diagnosis,
                 personalizedMedicalAdvice, freeGenerationWithoutContext,
                 fallbackAndHandoff]
              properties:
                faqOnly:
                  const: true
                booking:
                  const: false
                payments:
                  const: false
                diagnosis:
                  const: false
                personalizedMedicalAdvice:
                  const: false
                freeGenerationWithoutContext:
                  const: false
                fallbackAndHandoff:
                  const: true
            modules:
              type: array
              minItems: 9
              maxItems: 9
              items:
                $ref: "#/components/schemas/AiChatbotModule"
        meta:
          $ref: "#/components/schemas/Meta"

    ChatbotRule:
      type: object
      additionalProperties: false
      required:
        [triggerType, triggerValues, responseText, priority, enabled, action]
      properties:
        id:
          type: string
          format: uuid
        triggerType:
          type: string
          enum: [exact, alias, empty, fallback]
        triggerValues:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 100
        responseText:
          type: string
          minLength: 1
          maxLength: 4096
        priority:
          type: integer
          minimum: 0
          maximum: 9999
        enabled:
          type: boolean
        action:
          type: string
          enum: [reply, create_handoff]

    ChatbotConfig:
      type: object
      additionalProperties: false
      required: [revision, updatedAt, rules]
      properties:
        revision:
          type: integer
          minimum: 0
        updatedAt:
          type: string
          format: date-time
        rules:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/ChatbotRule"

    ChatbotConfigResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/ChatbotConfig"
        meta:
          $ref: "#/components/schemas/Meta"

    ChatbotConfigUpdateRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, rules]
      properties:
        expectedRevision:
          type: integer
          minimum: 0
        rules:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/ChatbotRule"

    ChatbotTestResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [normalizedInput, matchedRule, response]
          properties:
            normalizedInput:
              type: string
            matchedRule:
              type: object
              additionalProperties: false
              required:
                [triggerType, priority, matchedTrigger, action]
              properties:
                id:
                  type: string
                  format: uuid
                triggerType:
                  type: string
                  enum: [exact, alias, empty, fallback]
                priority:
                  type: integer
                matchedTrigger:
                  type: [string, "null"]
                action:
                  type: string
                  enum: [reply, create_handoff]
            response:
              type: string
        meta:
          $ref: "#/components/schemas/Meta"

    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 1
          maxLength: 256

    Meta:
      type: object
      additionalProperties: false
      required: [requestId, generatedAt]
      properties:
        requestId:
          type: string
        generatedAt:
          type: string
          format: date-time

    CursorMeta:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - type: object
          required: [nextCursor]
          properties:
            nextCursor:
              type: [string, "null"]

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code:
              type: string
              examples: [WHATSAPP_NOT_READY]
            message:
              type: string
            details:
              type: object
              additionalProperties: true
            requestId:
              type: string

    CurrentAdminResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [id, username, displayName, role, permissions]
          properties:
            id:
              type: string
              format: uuid
            username:
              type: string
            displayName:
              type: string
            role:
              type: string
              enum: [viewer, operator, admin]
            permissions:
              type: array
              items:
                type: string
        meta:
          $ref: "#/components/schemas/Meta"

    ServiceState:
      type: string
      enum: [connected, disconnected, unknown]

    SessionState:
      type: string
      enum:
        - starting
        - connecting
        - qr_required
        - connected
        - reconnecting
        - paused
        - logged_out
        - bad_session
        - disconnected
        - shutting_down

    Risk:
      type: string
      enum: [low, medium, high, critical, unknown]

    CapabilityState:
      type: string
      enum: [enabled, disabled, not_instrumented, unavailable]

    RateWindow:
      type: object
      additionalProperties: false
      required: [used, limit]
      properties:
        used:
          type: number
          minimum: 0
        limit:
          type: number
          exclusiveMinimum: 0

    OverviewResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [readiness, session, safety, rates, warmup, outbox, followUp, capabilities, recentEvents]
          properties:
            readiness:
              $ref: "#/components/schemas/Readiness"
            session:
              $ref: "#/components/schemas/SessionSnapshot"
            safety:
              $ref: "#/components/schemas/SafetySnapshot"
            rates:
              type: object
              additionalProperties: false
              required: [minute, hour, day]
              properties:
                minute:
                  oneOf:
                    - $ref: "#/components/schemas/RateWindow"
                    - type: "null"
                hour:
                  oneOf:
                    - $ref: "#/components/schemas/RateWindow"
                    - type: "null"
                day:
                  oneOf:
                    - $ref: "#/components/schemas/RateWindow"
                    - type: "null"
            warmup:
              oneOf:
                - $ref: "#/components/schemas/Warmup"
                - type: "null"
            outbox:
              oneOf:
                - $ref: "#/components/schemas/OutboxSummary"
                - type: "null"
            followUp:
              oneOf:
                - $ref: "#/components/schemas/FollowUpSummary"
                - type: "null"
            capabilities:
              type: object
              additionalProperties:
                $ref: "#/components/schemas/CapabilityState"
            recentEvents:
              type: array
              items:
                $ref: "#/components/schemas/OperationalEvent"
        meta:
          $ref: "#/components/schemas/Meta"

    Readiness:
      type: object
      additionalProperties: false
      required: [readyToSend, blockers, database, eventStream]
      properties:
        readyToSend:
          type: boolean
        blockers:
          type: array
          items:
            type: string
        database:
          $ref: "#/components/schemas/ServiceState"
        eventStream:
          $ref: "#/components/schemas/ServiceState"

    SessionSnapshot:
      type: object
      additionalProperties: false
      required:
        - state
        - connectedSince
        - lastDisconnect
        - reconnect
        - browser
        - credentialUpdatedAt
      properties:
        state:
          $ref: "#/components/schemas/SessionState"
        connectedSince:
          type: [string, "null"]
          format: date-time
        lastDisconnect:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [reason, classification, occurredAt]
              properties:
                code:
                  type: integer
                reason:
                  type: string
                classification:
                  type: string
                  enum: [recoverable, logged_out, bad_session, fatal, unknown]
                occurredAt:
                  type: string
                  format: date-time
        reconnect:
          type: object
          additionalProperties: false
          required: [attempt, nextRetryAt, eligible, disabledReason]
          properties:
            attempt:
              type: integer
              minimum: 0
            nextRetryAt:
              type: [string, "null"]
              format: date-time
            eligible:
              type: boolean
            disabledReason:
              type: [string, "null"]
        browser:
          type: object
          additionalProperties: false
          required: [platform, name]
          properties:
            platform:
              type: string
            name:
              type: string
        credentialUpdatedAt:
          type: [string, "null"]
          format: date-time

    OperationalEvent:
      type: object
      additionalProperties: false
      required: [id, type, severity, occurredAt, data]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        severity:
          type: string
          enum: [info, warning, critical]
        occurredAt:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true

    SafetySnapshot:
      type: object
      additionalProperties: false
      required: [risk, score, paused, reasons, recommendation]
      properties:
        risk:
          $ref: "#/components/schemas/Risk"
        score:
          type: [number, "null"]
          minimum: 0
          maximum: 100
        paused:
          type: boolean
        reasons:
          type: array
          items:
            type: string
        recommendation:
          type: string

    Warmup:
      type: object
      additionalProperties: false
      required: [day, totalDays, sentToday, limitToday, progressRatio]
      properties:
        day:
          type: integer
          minimum: 1
        totalDays:
          type: integer
          minimum: 1
        sentToday:
          type: integer
          minimum: 0
        limitToday:
          type: integer
        progressRatio:
          type: number
          minimum: 0
          maximum: 1

    OutboxSummary:
      type: object
      additionalProperties: false
      required: [queued, retrying, failed, oldestAgeMs]
      properties:
        queued:
          type: integer
          minimum: 0
        retrying:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        oldestAgeMs:
          type: number
          minimum: 0

    FollowUpSummary:
      type: object
      additionalProperties: false
      required: [open, unassigned, overdue]
      properties:
        open:
          type: integer
          minimum: 0
        unassigned:
          type: integer
          minimum: 0
        overdue:
          type: integer
          minimum: 0

    CreateMessageRequest:
      type: object
      additionalProperties: false
      required: [recipient, message]
      properties:
        recipient:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            contactId:
              type: string
            phone:
              type: string
              minLength: 10
              maxLength: 32
        message:
          type: object
          additionalProperties: false
          required: [type, text]
          properties:
            type:
              const: text
            text:
              type: string
              minLength: 1
              maxLength: 4096
        priority:
          type: string
          enum: [high, normal, low]
          default: normal
        scheduledAt:
          type: [string, "null"]
          format: date-time

    CreateMessageResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [id, outboxId, state]
          properties:
            id:
              type: string
              format: uuid
            outboxId:
              type: string
              format: uuid
            state:
              const: accepted
        meta:
          $ref: "#/components/schemas/Meta"

    Message:
      type: object
      additionalProperties: false
      required: [id, direction, messageType, content, state, createdAt]
      properties:
        id:
          type: string
        direction:
          type: string
          enum: [incoming, outgoing]
        messageType:
          type: string
        content:
          type: [string, "null"]
        state:
          type: string
          enum:
            - accepted
            - queued
            - scheduled
            - safety_delayed
            - sending
            - sent
            - delivered
            - read
            - retrying
            - failed
            - canceled
            - unknown_outcome
            - received
        providerMessageId:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time

    MessageEvent:
      type: object
      additionalProperties: false
      required: [id, eventType, reasonCode, metadata, occurredAt]
      properties:
        id:
          type: string
        eventType:
          type: string
        reasonCode:
          type: [string, "null"]
        metadata:
          type: object
          additionalProperties: true
        occurredAt:
          type: string
          format: date-time

    MessageDetailResponse:
