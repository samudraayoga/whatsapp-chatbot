name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  control-panel:
    name: Control panel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp-control-panel
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: whatsapp-control-panel/package-lock.json
      - name: Install
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Check
        run: npm run check

  chatbot-backend:
    name: Chatbot backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simple-whatsapp-chatbot
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: simple-whatsapp-chatbot/package-lock.json
      - name: Install
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Prepare Compose validation environment
        run: cp .env.example .env
      - name: Validate AI foundation infrastructure
        run: docker compose -f compose.yaml -f compose.ai-development.yaml config --quiet
      - name: Check
        run: npm run check

  antiban-contract:
    name: Anti-ban official check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: baileys-antiban
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: baileys-antiban/package-lock.json
      - name: Install
        run: npm ci
      - name: Type-check and official manual test
        run: npm run test:check

  production-images:
    name: Production images
    runs-on: ubuntu-latest
    needs:
      - control-panel
      - chatbot-backend
      - antiban-contract
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build backend image
        run: docker build -f simple-whatsapp-chatbot/Dockerfile -t whatsapp-app:ci .
      - name: Build control panel image
        run: docker build -f whatsapp-control-panel/Dockerfile -t whatsapp-panel:ci .
